name: "🕹️ QA REQUEST"
description: "검증 요청"
labels: ["qa"]
body:
  - type: textarea
    attributes:
      label: 📄 설명
      description: 요청할 검증에 대한 설명을 작성해 주세요.
      placeholder: 단답형 문장으로 핵심만 작성하세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔍 브랜치
      description: 타겟 브랜치를 입력해 주세요.
      placeholder: 브랜치 전체 이름을 입력하세요. (ex. feat/character/movement)
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔍 씬
      description: 검증할 타겟 씬을 입력해 주세요.
      placeholder: 타겟 씬 이름을 입력하세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔍 검증 절차
      description: 검증 절차를 나열해 주세요.
      placeholder: 플로우가 보이도록 1, 2, 3으로 입력 순서를 나열하세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 👤 담당자
      description: 담당자가 있다면 작성해주세요.
  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.
