name: Verify Docs

# PR마다 하네스 문서 규칙(크기 한도, 이름 규칙, 지식 index)을 검사한다.
# 브랜치 보호에서 이 검사를 "필수"로 지정하면, 실패한 PR은 병합할 수 없다.
on:
  pull_request:
    branches:
      - dev
      - "integration/**"
      - "builds/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "resource/**"

jobs:
  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run harness checks (verify-fast)
        shell: pwsh
        run: ./Scripts/verify-fast.ps1

      - name: Test simplified task and sharing workflow
        shell: pwsh
        run: ./Scripts/Tests/harness-flow.test.ps1 -ScratchRoot "${{ runner.temp }}"

      - name: Test asset helper with local Git and LFS
        shell: pwsh
        run: ./Scripts/Tests/asset-helper.test.ps1 -ScratchRoot "${{ runner.temp }}"
  verify-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run scope check (verify-scope)
        shell: pwsh
        run: ./Scripts/verify-scope.ps1 -Branch "${{ github.head_ref }}" -Base "origin/${{ github.base_ref }}" -Actor "${{ github.actor }}"

  verify-third-party:
    # 모든 PR: 외부 에셋이 Assets/_ThirdParty(private submodule) 밖에 있거나, submodule 포인터가 private 레포에 없으면 실패.
    # private 레포 확인에는 Secret THIRD_PARTY_TOKEN(CURTAINCALL_PaidAssets Contents: Read-only)이 필요하다. 없으면 경로 검사만 한다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check third-party assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.THIRD_PARTY_TOKEN }}
        run: ./Scripts/verify-third-party.ps1 -CheckSubmodule

  verify-commits:
    # 모든 PR: 커밋 작성자·공동 작성자에 AI 이름(Claude 등)이 있으면 실패. 커밋은 팀원 GitHub 계정으로만.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI authors and co-authors
        shell: bash
        run: |
          RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          BAD=$(git log --format='%h %an <%ae> / %cn <%ce>%n%(trailers:key=Co-authored-by,valueonly)' "$RANGE" \
            | grep -iE 'claude|anthropic|openai|chatgpt|copilot|gemini|codex' || true)
          if [ -n "$BAD" ]; then
            echo "AI 이름이 작성자·공동 작성자로 들어간 커밋이 있습니다:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: 모든 커밋이 팀원 계정으로 작성됨"
