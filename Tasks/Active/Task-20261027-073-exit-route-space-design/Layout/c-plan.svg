t-anchor="middle" class="label" transform="rotate(-90 350 371)">03 대포 + 외줄</text><rect x="400" y="271" width="160" height="80" fill="#304b5a" stroke="#80969f" stroke-width="1.5"/><text x="480" y="311" text-anchor="middle" class="label">04 하강·굽이</text><rect x="480" y="351" width="150" height="200" fill="#514736" stroke="#80969f" stroke-width="1.5"/><text x="555" y="451" text-anchor="middle" class="label">05 트램폴린 + 그네</text><rect x="630" y="375" width="100" height="176" fill="#304b5a" stroke="#80969f" stroke-width="1.5"/><text x="680" y="463" text-anchor="middle" class="label" transform="rotate(-90 680 463)">06 재합류</text><rect x="650" y="195" width="80" height="180" fill="#304b5a" stroke="#80969f" stroke-width="1.5"/><text x="690" y="285" text-anchor="middle" class="label" transform="rotate(-90 690 285)">07A 질주</text><rect x="730" y="195" width="170" height="80" fill="#304b5a" stroke="#80969f" stroke-width="1.5"/><rect x="760" y="275" width="140" height="150" fill="#304b5a" stroke="#80969f" stroke-width="1.5"/><text x="830" y="350" text-anchor="middle" class="label">07B 출구 작업</text><rect x="900" y="275" width="120" height="150" fill="#365141" stroke="#80969f" stroke-width="1.5"/><text x="960" y="350" text-anchor="middle" class="label">08 외부</text><polyline points="120,523 148,501 350,501 350,435 330,367 364,303 452,311 524,311 536,375 536,427 576,459 552,491 552,523 672,523 690,239 824,239 828,351 968,351" fill="none" stroke="#70ded7" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" opacity=".9"/><text x="60" y="630" font-size="19" font-weight="bold">구조의 차이</text><text x="60" y="661" font-size="16">03: 가로 진입에서 북쪽 횡단으로 방향이 바뀝니다.</text><text x="60" y="689" font-size="16">고립 발판은 옆으로 치우치며 외줄도 대각으로 잇습니다.</text><text x="60" y="717" font-size="16">05: 남쪽을 향해 엇갈린 그네를 건너 동쪽으로 빠져나옵니다.</text><text x="60" y="745" font-size="16">긴 북상 질주 뒤 출구 작업실을 내려다보며 진입합니다.</text><text x="60" y="795" class="small">배경 구조 제작안입니다. 묘기 사거리·공중 잡기·다인 운용·추격·최종 난도는 검증되지 않았습니다.</text></